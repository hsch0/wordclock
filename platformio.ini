; Wordclock - Arduino Nano (ATmega328P, old bootloader @ 57600 baud)

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_port = /dev/cu.usbserial-10
monitor_port = /dev/cu.usbserial-10
monitor_speed = 115200
lib_deps =
    paulstoffregen/Time@^1.6.1
    paulstoffregen/DS1307RTC
    jchristensen/Timezone@^1.2.4
    fastled/FastLED@3.6.0
